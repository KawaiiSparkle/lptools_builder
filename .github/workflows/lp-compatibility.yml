# Exact source payload: no GitHub repository fetch or runner SSH key is required.
name: LP latest-release compatibility
'on':
  push:
    branches:
    - compat/latest-release
  workflow_dispatch:
    inputs:
      latest_ref:
        description: Official AOSP manifest ref to test
        default: android-latest-release
        required: true
permissions:
  contents: read
concurrency:
  group: lp-compat-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      AOSP_REF: ${{ inputs.latest_ref || 'android-latest-release' }}
      LPTOOLS_PRODUCT: lptools_host
      LPTOOLS_BUILDER_SHA: ${{ github.sha }}
      LPTOOLS_BUILDER_BRANCH: ${{ github.ref_name }}
