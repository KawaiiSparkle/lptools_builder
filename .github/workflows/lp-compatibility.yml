    - name: Verify and unpack build scripts
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import base64, hashlib, io, os, tarfile
        from pathlib import Path
        raw = base64.b64decode((Path(os.environ["RUNNER_TEMP"]) / "lptools-payload.b64").read_bytes())
        assert hashlib.sha256(raw).hexdigest() == "ea1775d58d6fcf22aaed864973a63a0aa86d674f6718826f11862a08a9ba349b"
        root = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
        with tarfile.open(fileobj=io.BytesIO(raw), mode="r:gz") as archive:
            for item in archive.getmembers():
                dest = (root / item.name).resolve()
                assert item.isfile() and dest.is_relative_to(root)
                dest.parent.mkdir(parents=True, exist_ok=True)
                dest.write_bytes(archive.extractfile(item).read())
                dest.chmod(item.mode)
        PY
    - uses: ./.github/actions/prepare
    - name: Build current latest-release tools
      shell: bash
      run: |
        set -euo pipefail
        bash scripts/build-linux.sh --ref "$AOSP_REF" --jobs 4 \
          --project-list "$GITHUB_WORKSPACE/config/projects-latest.txt" \
          --work "$GITHUB_WORKSPACE/aosp" --out "$GITHUB_WORKSPACE/dist"
    - name: Build historical writers and run partition round trips
      shell: bash
      run: |
        set -euo pipefail
        source scripts/log.sh
        run_beat "historical builds and compatibility matrix" python3 -u scripts/run-lp-compatibility.py \
          --aosp "$GITHUB_WORKSPACE/aosp" \
          --latest-bin "$GITHUB_WORKSPACE/dist/lptools-linux-x86_64/bin" \
          --out "$GITHUB_WORKSPACE/compat-out"
    - name: Preserve reports and tool provenance
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lp-latest-release-compatibility
        compression-level: 0
        if-no-files-found: warn
        path: |-
          compat-out/compatibility-report.*
          compat-out/matrix/lp-compatibility.*
          compat-out/matrix/logs/
          compat-out/historical/writer-list.json
          compat-out/historical/*/manifest.json
          compat-out/historical/logs/
          compat-out/historical/source/*/pin.json
          dist/*.tar.gz
          dist/*.sha256
          dist/lptools-linux-x86_64/manifest.json
          dist/lptools-linux-x86_64/aosp-manifest.xml
