# Generated by scripts/make-upstream-workflow.py; regenerate after embedded file changes.
# Official AOSP source; no patch payload, no historical writer build.
name: LP upstream build (unpatched)
'on':
  push:
    branches:
    - build/upstream
  workflow_dispatch:
    inputs:
      aosp_ref:
        description: Official AOSP manifest ref
        default: android-latest-release
        required: true
permissions:
  contents: read
concurrency:
  group: lp-upstream-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      AOSP_REF: ${{ inputs.aosp_ref || 'android-latest-release' }}
      LPTOOLS_PRODUCT: lptools_host
      LPTOOLS_BUILDER_SHA: ${{ github.sha }}
      LPTOOLS_BUILDER_BRANCH: ${{ github.ref_name }}
      LPTOOLS_BUILDER_REF: git@github.com:${{ github.repository }}.git
      PYTHONUNBUFFERED: '1'
